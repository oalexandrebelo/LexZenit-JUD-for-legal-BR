name: Brazilian layer quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: br-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install bounded runtime dependency
        run: python -m pip install -r runtime/requirements.txt
      - name: Validate Brazilian catalog
        run: python scripts/validate_br.py
      - name: Test repository and local Git composition
        run: python -m unittest discover -s tests -v
      - name: Test evidence and calculation runtime
        working-directory: runtime
        run: python -m unittest discover -s tests -v
